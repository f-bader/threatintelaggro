services:
  threat-intel-aggro:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5088:8080"
    environment:
      AGGRO_DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - aggro-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aggro-data:
