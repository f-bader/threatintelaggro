services:
  threat-intel-aggro:
    image: ghcr.io/f-bader/threatintelaggro:${AGGRO_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:5088:8080"
    environment:
      AGGRO_DATA_DIR: /data
      AGGRO_TRUSTED_PROXY_IPS: ${AGGRO_TRUSTED_PROXY_IPS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - aggro-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aggro-data:
